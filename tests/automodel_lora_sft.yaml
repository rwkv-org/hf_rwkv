# LoRA + FSDP2 SFT smoke/benchmark recipe for a converted RWKV7 HF directory.
#
# Install SwanLab support once in the Automodel checkout:
#   uv pip install "nemo-automodel[swanlab]"
# and provide SWANLAB_API_KEY (or run `swanlab login`).
#
#   PYTHONPATH=/path/to/fla-MA \
#     .venv/bin/automodel <this-file> --nproc-per-node 2
#
# For 2 GPUs keep global_batch_size = nproc_per_node * local_batch_size.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 2
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 8

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: /path/to/converted-rwkv7-hf
  torch_dtype: bf16
  trust_remote_code: true
  attn_implementation: eager

tokenizer:
  _target_: nemo_automodel.NeMoAutoTokenizer.from_pretrained
  pretrained_model_name_or_path: /path/to/converted-rwkv7-hf
  trust_remote_code: true

checkpoint:
  enabled: false

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  target_modules: ["*_proj", "*.ffn.key", "*.ffn.value"]
  dim: 16
  alpha: 32
  use_triton: true
  use_memory_efficient_lora: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false

compile:
  enabled: false

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.build_unpacked_dataset
  num_sentences: 32
  mean_len: 256
  std_len: 0
  vocab_size: 100
  max_sentence_len: 512
  seed: 0

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.mock.build_unpacked_dataset
  num_sentences: 2
  mean_len: 256
  std_len: 0
  vocab_size: 100
  max_sentence_len: 512
  seed: 1

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.Adam
  betas: [0.9, 0.999]
  eps: 1e-8
  lr: 1.0e-4
  weight_decay: 0

# SwanLab is driven through the W&B-compatible logger. W&B upload is disabled.
wandb:
  project: rwkv7-sft
  name: rwkv7-lora-fsdp2
  swanlab:
    mode: online
    upload_to_wandb: false
